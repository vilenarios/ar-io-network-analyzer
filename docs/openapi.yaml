openapi: 3.1.0

info:
  title: AR.IO Observation Watch API
  version: 1.0.0
  summary: Preserved AR.IO epoch observations and observer-independence findings.
  description: |
    A read-only API over AR.IO epoch observations captured from Solana before the
    network reclaims them, plus findings about whether the observers that produced
    them were actually independent.

    ## Why this exists

    The observation protocol assumes independent observers reaching majority
    agreement. On-chain `Observation` accounts are closed to reclaim rent within
    days, and `close_observation` is permissionless — so effective retention is
    the minimum across every cranker running, not a value any operator controls.
    A capture daemon polls every 10 minutes and preserves them.

    ## How to consume it

    Every response is a **precomputed static document**, regenerated on a
    schedule — no query is executed per request. Consequences worth designing for:

    - Responses carry `Cache-Control: public, max-age=60` and a strong ETag that
      is a hash of the content. Send `If-None-Match` and expect `304`.
    - `generatedAt` on every document is the generation time, not request time.
    - Start from `/api/v1/index.json`: it is the manifest, listing every
      available document with its size, sha256 and generation time. Prefer
      discovering paths from it over hardcoding them.

    ## Two properties that will surprise you

    **The findings feed is windowed.** `/api/v1/findings.json` carries a rolling
    30-epoch window, not all history, because the full set grows without bound.
    It states its own window in the `window` object. Older findings stay
    addressable at `/api/v1/epochs/{epochIndex}.json`.

    **Published pair lists are truncated.** The pairwise similarity matrix is
    O(n²) in an epoch's observer count (the protocol caps observers at 50, so up
    to 1225 pairs). Findings publish the 20 most-similar pairs and report
    `pairsTotal` and `pairsTruncated`. Never treat `pairs` as the complete set.

    ## Interpreting findings

    Findings are **observations about observers, not verdicts about people**.
    "Seven observers submitted the same report from one address" is what the data
    supports; "these are sybils" is not. Check `calibrated` before trusting a
    similarity-based finding — while it is `false`, the threshold is a
    placeholder and `near_identical_results` over-sweeps.

  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later

servers:
  - url: /
    description: Behind an nginx TLS proxy; the service itself binds 127.0.0.1.

tags:
  - name: Discovery
    description: Start here — the manifest describes everything else.
  - name: Findings
    description: Observer-independence signals.
  - name: Epochs
    description: Per-epoch observations, including older findings.
  - name: Operations
    description: Liveness and freshness.

paths:
  /api/v1/index.json:
    get:
      operationId: getIndex
      tags: [Discovery]
      summary: Document manifest
      description: |
        Lists every published document with its path, byte size, sha256 and
        generation time, plus freshness of the capture and analysis cadences.
        Discover paths from here rather than hardcoding them.
      responses:
        '200':
          description: The manifest.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IndexDocument' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFoundJson' }

  /api/v1/findings.json:
    get:
      operationId: getFindings
      tags: [Findings]
      summary: Rolling findings feed (windowed)
      description: |
        Findings across the most recent epochs. **Windowed** — inspect `window`
        to see how many epochs are carried and whether anything was truncated.
        For epochs outside the window use `/api/v1/epochs/{epochIndex}.json`.
      responses:
        '200':
          description: The windowed feed.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingsDocument' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFoundJson' }

  /api/v1/economics.json:
    get:
      operationId: getEconomicsSeries
      tags: [Analysis]
      summary: Protocol economics time series
      description: |
        One row per completed epoch, oldest first, append-only. Amounts in
        **mARIO**; `demandFactor` unscaled, as in `portal/summary.json`.

        Exists because `protocolBalance` was recomputed every publish cycle and
        immediately discarded — only one sample ever existed, so no delta could
        be taken and protocol revenue was not derivable at any point in time.
        Nothing new is measured here; the missing capability was retention.

        The identity this enables:

        ```
        netInflow(t) = protocolBalance(t) − protocolBalance(t−1)
                       + totalEligibleRewards(t)
        ```

        **Components, not conclusions.** There is deliberately no `revenue`
        field: the protocol balance also moves for reasons that are not ArNS
        revenue, so a figure derived from these components should be labelled
        *net protocol inflow* until inflows can be attributed by source. Do the
        subtraction client-side.

        Epoch 510 is the worked example. It shows +60,100,376.84 ARIO of
        inflow, of which exactly 60,000,000 was a deliberate treasury deposit —
        two transfers from one authority on 2026-08-11. On chain that is
        indistinguishable from demand, and at roughly $66k it is 97% of the
        USD total for the epochs published so far. Exclude or annotate it in
        anything a human will read as earnings.

        **The earliest row has no predecessor**, so any delta derived from it is
        undefined — render it as null, never zero.

        **Gaps are real and must be rendered as gaps.** A row is written only
        when the protocol balance could actually be read shortly after that
        epoch distributed. If it could not, the epoch is omitted permanently
        rather than carried forward, interpolated or zero-filled — a fabricated
        point silently corrupts every delta that spans it. Never assume
        `series[i+1].epochIndex === series[i].epochIndex + 1`.

        **Every row is anchored to its epoch boundary**, not to when the
        publisher happened to sample. `endTimestamp` is that boundary and `slot`
        is the exact slot the balance was read at, so consecutive rows are
        always one epoch apart and their difference means what it looks like.
        (Anchoring matters: the very first row written was sampled 15.4 hours
        late and absorbed 35,725 ARIO of the following epoch before this was
        corrected.)

        **History can be recovered, and some of this series was.** The balance
        at any past boundary is recoverable from Solana transaction metadata —
        `postTokenBalances` on the last transaction that changed the protocol
        account before that moment — so the operator command
        `yarn economics:backfill` can extend the series backwards. Recovered
        rows are measurements, not estimates, and were validated against the
        live pipeline's independent SDK reading at the same instant (exact
        match). What is *not* recoverable is the PDA state of that moment, so
        **recovered rows carry `null` for `demandFactor`, `circulating`,
        `staked`, `delegated` and `arnsRecordCount`** rather than borrowing
        today's values. Treat those fields as independently nullable on every
        row; only `protocolBalance` is guaranteed.

        `arioPriceUsd` is the only off-chain field, is independently nullable,
        and carries its own provenance (`arioPriceSource`, `arioPriceAt`) — a
        price outage costs the price, never the on-chain row. `arioPriceSource`
        distinguishes a spot reading (`coingecko:ar-io-network`) from a daily
        close (`coingecko:ar-io-network:daily-close`); do not treat the two as
        interchangeable for intraday work.
      responses:
        '200':
          description: The retained series.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EconomicsSeries' }
        '304': { $ref: '#/components/responses/NotModified' }
        '503': { $ref: '#/components/responses/NotPublished' }

  /api/v1/rewards.json:
    get:
      operationId: getRewards
      tags: [Analysis]
      summary: What each staking position has earned
      description: |
        Per-position earnings, so a holder can be shown "you have earned this
        much" rather than only "you currently hold this much".

        **Why this is not simply a field on the stake record.** Rewards compound
        directly into stake, so on-chain state shows what a position HOLDS and
        never what it EARNED — 98.4% of delegations carry sub-ARIO precision,
        and the large ones sit just above round numbers. Earnings are a
        difference, and the difference has to be sourced from somewhere.

        **Two kinds of row, with different guarantees.** `basis` says which:

        - `events` — EXACT. Decoded from the program's own
          `CompoundDelegationRewards` events, which name the delegate, the
          gateway and the amount credited. Because events live in transaction
          logs they are recoverable from history, so this series was backfilled
          and is replayable.
        - `inferred` — derived from stake observed either side of an epoch,
          used for gateway operators because `DistributeEpoch` emits only an
          epoch summary and no per-operator record. Requires two snapshots, so
          it begins only once retention has run for two epochs.

        Blending the two under one field would make an inferred figure
        indistinguishable from a measured one, so they are labelled instead.

        **`rewards` is aligned index-for-index with the top-level `epochs`.**
        A `null` entry means that epoch was scanned and this position earned
        nothing. An epoch absent from `epochs` was never scanned, and must not
        be rendered as a zero — "scanned and empty" and "not looked at" are
        different facts.

        **There is deliberately no APY field.** An annual rate from days of
        history is an extrapolation, and which extrapolation — simple or
        compounded, time-weighted or not, per position or per wallet — is a
        presentation decision. The components are here: per-epoch rewards, the
        stake they were earned on, and each epoch's end time. Compute it
        explicitly and label it honestly; prefer "realized yield" over "APY"
        until the history is long enough to annualize without embarrassment.
      responses:
        '200':
          description: Per-position earnings.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RewardsDocument' }
        '304': { $ref: '#/components/responses/NotModified' }
        '503': { $ref: '#/components/responses/NotPublished' }

  /api/v1/network.json:
    get:
      operationId: getNetworkSummary
      tags: [Analysis]
      summary: Network centralization summary (daily)
      description: |
        The output of the daily centralization analysis — the starting point
        for network-health and actor-concentration work.

        - `totals` — `gatewaysInNetwork` (every gateway on chain) vs
          `gatewaysAnalyzed` (those `joined` **and** carrying an FQDN, so
          roughly half), plus `resolved`, `failedDns`, `clustered` and
          `highCentralization`.
        - `clusters` — groups of gateways that look like one actor, each with
          `size`, `avgScore`, `baseDomain`, `pattern`, member `gateways`,
          `wallets` and `totalRewards`.
        - `topSuspicious` — per-gateway `score` with the `reasons` that produced
          it.
        - `infrastructure` — datacenter share, `topProviders`,
          `countryDistribution`, unique ISP/country/ASN counts.
        - `observers` — a rollup of the observer-independence findings
          (`findingCount`, `bySeverity`, `byKind`) so one fetch answers "how
          concentrated is the network, and do the observers agree".

        **Check `generatedAt` before drawing conclusions.** This is refreshed
        once a day, not every ten minutes like the portal documents. A stale
        value here means the analysis stopped, not that the network stopped
        moving.

        Two fields are load-bearing when comparing runs: `infrastructure` is
        empty and `totals.highCentralization` collapses to 0 if the analysis
        ran with `SKIP_GEO=1` — geography carries 25% of the centralization
        score. A report with `uniqueAsns: 0` is a degraded run, not a
        decentralized network. `economics` is an estimate — per-gateway reward
        times cluster size — not a record of payments.
      responses:
        '200':
          description: Network centralization summary.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkSummary' }
        '304': { $ref: '#/components/responses/NotModified' }
        '503': { $ref: '#/components/responses/NotPublished' }

  /api/v1/gateways.json:
    get:
      operationId: getGatewayRoster
      tags: [Analysis]
      summary: Per-gateway analysis roster (daily)
      description: |
        One row per analysed gateway — the per-entity detail behind
        `network.json`'s aggregates. Use this to attribute a cluster to
        specific operators, or to join centralization scores against stake,
        rewards and resolved infrastructure.

        Only gateways that are `joined` **and** publish an FQDN appear, because
        the analysis resolves DNS and fingerprints each host. Compare the row
        count against `network.json`'s `totals.gatewaysInNetwork` before
        treating it as the whole network.

        This is **not** `/api/v1/portal/gateways.json`. That one is the raw SDK
        gateway records refreshed every 10 minutes for the portal; this is the
        daily analysis output with scores and resolved infrastructure attached.
      responses:
        '200':
          description: Analysed gateway roster.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '304': { $ref: '#/components/responses/NotModified' }
        '503': { $ref: '#/components/responses/NotPublished' }

  /api/v1/observers.json:
    get:
      operationId: getObservers
      tags: [Findings]
      summary: Per-observer rollup
      description: |
        One entry per observer seen in the retained window, with how many epochs
        it observed, how often it shared a report transaction with another
        observer, and the worst severity attached to it.
      responses:
        '200':
          description: The observer rollup.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObserversDocument' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFoundJson' }

  /api/v1/epochs/{epochIndex}.json:
    get:
      operationId: getEpoch
      tags: [Epochs]
      summary: One epoch in full
      description: |
        Every captured observation for a single epoch plus its findings. This is
        the durable address for findings that have aged out of the feed window.
      parameters:
        - name: epochIndex
          in: path
          required: true
          description: AR.IO epoch index.
          schema: { type: integer, minimum: 0, examples: [511] }
      responses:
        '200':
          description: The epoch document.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EpochDocument' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404':
          description: |
            No document for that epoch. Either it predates capture, or capture
            was not running when it closed — on-chain observations are
            unrecoverable once closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }


  /api/v1/portal/index.json:
    get:
      operationId: getPortalManifest
      tags: [Portal]
      summary: Portal snapshot manifest
      description: |
        Start here. Lists every portal document with its size, sha256 and
        generation time, plus a `freshness` block saying whether the publisher
        is still succeeding.

        This is the document a client polls. It is small and separately
        cacheable (`max-age=30`) so a consumer can check freshness without
        re-downloading the collections.

        **Check `freshness.stale` before trusting the data.** A failed publish
        cycle leaves the documents in place — they are still the best available
        — and records the failure here. A client that ignores this cannot tell
        a snapshot published a minute ago from one that stopped updating hours
        ago.
      responses:
        '200':
          description: The portal manifest.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalManifest' }
        '304': { $ref: '#/components/responses/NotModified' }
        '503': { $ref: '#/components/responses/NotPublished' }

  /api/v1/portal/gateways.json:
    get:
      operationId: getPortalGateways
      tags: [Portal]
      summary: Every gateway in the network
      description: |
        The full gateway roster, carrying the SDK's decoded shape verbatim —
        `gatewayAddress`, `operatorStake`, `totalDelegatedStake`, `settings`,
        `stats`, `weights`, `status` and timestamps.

        Replaces a `getGateways` whole-program scan per browser.
      responses:
        '200':
          description: Gateway collection.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalCollection' }
        '304': { $ref: '#/components/responses/NotModified' }
        '503': { $ref: '#/components/responses/NotPublished' }

  /api/v1/portal/vaults.json:
    get:
      operationId: getPortalVaults
      tags: [Portal]
      summary: Every vault
      description: |
        All vaults, each with `address`, `vaultId`, `balance`, `controller` and
        its start/end timestamps. Replaces a `getVaults` whole-program scan.
      responses:
        '200':
          description: Vault collection.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalCollection' }
        '304': { $ref: '#/components/responses/NotModified' }
        '503': { $ref: '#/components/responses/NotPublished' }

  /api/v1/portal/balances.json:
    get:
      operationId: getPortalBalances
      tags: [Portal]
      summary: Every non-zero ARIO balance
      description: |
        Complete, not truncated: `{ address, balance }` for every holder with a
        non-zero balance. Zero balances are omitted by the SDK, not by this
        service.

        Balances are in **mARIO**, as returned on chain. Convert at the display
        boundary.
      responses:
        '200':
          description: Balance collection.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalCollection' }
        '304': { $ref: '#/components/responses/NotModified' }
        '503': { $ref: '#/components/responses/NotPublished' }

  /api/v1/portal/delegates.json:
    get:
      operationId: getPortalDelegates
      tags: [Portal]
      summary: Every delegation
      description: |
        One entry per delegation: `address` (the delegator), `gatewayAddress`,
        `delegatedStake`, `vaultedStake` and `startTimestamp`.

        This single document answers three separate on-chain queries. Filter by
        `address` for one wallet's delegations, or by `gatewayAddress` for one
        gateway's delegators — neither needs its own request.
      responses:
        '200':
          description: Delegation collection.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalCollection' }
        '304': { $ref: '#/components/responses/NotModified' }
        '503': { $ref: '#/components/responses/NotPublished' }

  /api/v1/portal/withdrawals.json:
    get:
      operationId: getPortalWithdrawals
      tags: [Portal]
      summary: Every gateway withdrawal (unlocking vault)
      description: |
        One entry per `Withdrawal` account in the GAR program: `cursorId`,
        `vaultId`, `balance`, `startTimestamp`, `endTimestamp` and
        `gatewayAddress`.

        Filter by `gatewayAddress` for one gateway's unlocking vaults, which
        is what the portal's per-gateway view needs.

        This does NOT answer `getWithdrawals(address)`. Both public SDK
        projections drop the withdrawal's `owner`, so a per-wallet lookup
        still needs its own call — a memcmp-filtered read, not a whole-program
        scan, so it is not what this service exists to displace.
      responses:
        '200':
          description: Withdrawal collection.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalCollection' }
        '304': { $ref: '#/components/responses/NotModified' }
        '503': { $ref: '#/components/responses/NotPublished' }

  /api/v1/portal/primaryNames.json:
    get:
      operationId: getPortalPrimaryNames
      tags: [Portal]
      summary: Every primary name
      description: |
        One entry per primary-name assignment. Filter by address to resolve a
        single wallet's primary name.

        Worth publishing out of proportion to its size: the SDK's
        `getPrimaryName(address)` is an **unfiltered** whole-program scan that
        deserializes every primary-name account and filters client-side, so
        each visitor resolving one name scans the whole set.
      responses:
        '200':
          description: Primary name collection.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalCollection' }
        '304': { $ref: '#/components/responses/NotModified' }
        '503': { $ref: '#/components/responses/NotPublished' }

  /api/v1/portal/arnsRecords.json:
    get:
      operationId: getPortalArnsRecords
      tags: [Portal]
      summary: Every ArNS record
      description: |
        The full ArNS registry, SDK shape verbatim. The largest document by
        some margin (~160 KB gzipped against ~280 KB for everything else
        combined), so fetch it only if you list or search names.

        **If you only want the count, read `summary.json`'s
        `counts.arnsRecords` instead.** Note that asking the SDK for
        `getArNSRecords({ limit: 1 })` does not save anything: it scans the
        whole program and deserializes every record before truncating in
        memory. Publishing this document therefore costs no additional RPC —
        the publisher already did the scan.
      responses:
        '200':
          description: ArNS record collection.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalCollection' }
        '304': { $ref: '#/components/responses/NotModified' }
        '503': { $ref: '#/components/responses/NotPublished' }

  /api/v1/portal/summary.json:
    get:
      operationId: getPortalSummary
      tags: [Portal]
      summary: Network scalars and collection counts
      description: |
        The values a client would otherwise fetch one RPC call at a time on
        every page load: `tokenSupply`, `demandFactor`,
        `gatewayRegistrySettings`, and a `counts` block including
        `arnsRecords`.

        `arnsRecords` is a count only. Publishing all ~3,000 ArNS records would
        add ~160 KB for a number nothing else needs.

        `demandFactor` is `null` when that read failed. It is the one value
        whose absence degrades the document rather than failing the cycle.
      responses:
        '200':
          description: Summary document.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalSummary' }
        '304': { $ref: '#/components/responses/NotModified' }
        '503': { $ref: '#/components/responses/NotPublished' }

  /archive/{date}/{file}:
    get:
      operationId: getArchivedReport
      tags: [Analysis]
      summary: An archived daily analysis run
      description: |
        Each daily run is archived under its date, so a centralization figure
        can be compared against the same figure a week earlier. Enumerate the
        available dates from `/api/v1/index.json`'s `archive` array rather than
        guessing — a date with no run is a 404.

        Exactly three files are published per date, and nothing else in the
        directory is reachable:

        | File | Use |
        |---|---|
        | `summary.json` | machine-readable — the same shape as `network.json` for that day |
        | `gateways.csv` | per-gateway rows, for spreadsheets and notebooks |
        | `index.html` | the rendered report |

        For trend analysis prefer `summary.json`; it is the only one of the
        three with a stable schema.
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
          description: UTC date of the run, as listed in the manifest's `archive` array.
          example: '2026-08-24'
        - name: file
          in: path
          required: true
          schema:
            type: string
            enum: [summary.json, gateways.csv, index.html]
          description: |
            Only these three are served. Any other name is a 404 — the
            namespace is an allowlist, not a directory listing.
      responses:
        '200':
          description: The archived file.
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
            text/csv: { schema: { type: string } }
            text/html: { schema: { type: string } }
        '404':
          description: No run for that date, or a filename outside the allowlist.

  /:
    get:
      operationId: getHomepage
      tags: [Analysis]
      summary: The latest rendered report (HTML)
      description: |
        Human-facing. The current day's centralization report, the same content
        as the newest `/archive/{date}/index.html`. Agents should read
        `/api/v1/network.json` instead — same analysis, structured.
      responses:
        '200':
          description: HTML report.
          content:
            text/html: { schema: { type: string } }
        '503': { $ref: '#/components/responses/NotPublished' }

  /api/v1/openapi.yaml:
    get:
      operationId: getOpenApiSpec
      tags: [Meta]
      summary: This document
      description: |
        The API serves its own contract, so an agent can bootstrap from the host
        alone rather than needing to know which repository and branch to read.

        Republished on every publish cycle from the deployed source tree, so it
        always describes the code that is actually running — a spec that has
        drifted from its deployment is worse than none.

        Deliberately absent from the manifests: this is documentation, not
        network state, and a consumer diffing document digests should not see
        churn because only the spec changed.
      responses:
        '200':
          description: This OpenAPI document.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/yaml:
              schema: { type: string }
        '304': { $ref: '#/components/responses/NotModified' }
        '404':
          description: |
            The publisher has not run since this endpoint was added, or the
            source tree has no docs/openapi.yaml.

  /healthz:
    get:
      operationId: getHealth
      tags: [Operations]
      summary: Liveness and freshness
      description: |
        The only endpoint that touches SQLite, so it is measurably slower
        (~13 ms vs <2 ms) than the static documents. Do not cache it and do not
        point a high-frequency check at it.

        `status` is `ok` when capture is fresh and publishing succeeded.
        Alert on `capture.stale` and on `capture.accountCount == 0` — a zero
        account count means the discriminator stopped matching, which would
        otherwise look like a quiet, healthy network.
      responses:
        '200':
          description: Health snapshot. Inspect `status`; 200 does not imply healthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

components:
  headers:
    ETag:
      description: Strong validator; a hash of the document content.
      schema: { type: string }
    CacheControl:
      description: Always `public, max-age=60`.
      schema: { type: string, examples: ['public, max-age=60'] }

  responses:
    NotModified:
      description: Content unchanged since the `If-None-Match` value.
    NotPublished:
      description: |
        Nothing has been published in this namespace yet. The service is up but
        has no data — a publisher has not completed a first cycle. Checked per
        namespace, so a portal-only deployment is not gated on the observer
        documents.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFoundJson:
      description: No such document.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    PortalNetwork:
      type: string
      enum: [mainnet, devnet, testnet, localnet, unknown]
      description: |
        Set by the publisher's required `PORTAL_NETWORK`, or inferred from the RPC endpoint when its host names the cluster. Never `unknown` — the publisher refuses to start rather than publish a network no consumer can match.
        The endpoint itself is never exposed — it may carry a provider token.

    PortalFreshness:
      type: object
      required: [generatedAt, ageSeconds, stale, consecutiveFailures]
      properties:
        generatedAt:
          type: string
          format: date-time
          description: When the documents this manifest describes were written.
        ageSeconds:
          type: integer
          description: Zero as published; recomputed by the server on read.
        stale:
          type: boolean
          description: |
            True when the last publish cycle failed. The documents are the
            previous cycle's and have not changed.
        lastSuccessAt:
          type: [string, 'null']
          format: date-time
        consecutiveFailures:
          type: integer
          description: Consecutive failed cycles. Alert above 2 at a 10-minute cadence.

    PortalManifest:
      type: object
      required: [schemaVersion, generatedAt, network, programIds, documents, freshness]
      properties:
        schemaVersion: { $ref: '#/components/schemas/SchemaVersion' }
        generatedAt: { type: string, format: date-time }
        network: { $ref: '#/components/schemas/PortalNetwork' }
        programIds: { $ref: '#/components/schemas/PortalProgramIds' }
        documents:
          type: object
          additionalProperties: { $ref: '#/components/schemas/DocumentRef' }
          description: |
            Keyed by document name — gateways, vaults, balances, delegates,
            withdrawals, primaryNames, arnsRecords, summary.
        freshness: { $ref: '#/components/schemas/PortalFreshness' }

    EconomicsSeries:
      type: object
      required: [schemaVersion, generatedAt, series]
      properties:
        schemaVersion: { $ref: '#/components/schemas/SchemaVersion' }
        generatedAt: { type: string, format: date-time }
        series:
          type: array
          description: |
            Oldest first, one row per sampled epoch. May be empty, and may skip
            epoch indexes — see the endpoint description.
          items:
            type: object
            required: [epochIndex, protocolBalance]
            properties:
              epochIndex: { type: integer }
              endTimestamp:
                type: [integer, 'null']
                description: Epoch end, unix **milliseconds**.
                example: 1787616250000
              slot:
                type: [integer, 'null']
                description: |
                  Slot the balance was observed at, when known. Null means not
                  recorded — preferable to a slot read at a different moment
                  than the balance.
              protocolBalance:
                type: integer
                description: Reward-reserve balance, mARIO. The field the series exists to retain.
              totalEligibleRewards:
                type: [integer, 'null']
                description: The epoch's eligible rewards, mARIO, from the Epoch PDA.
              demandFactor: { type: [number, 'null'] }
              circulating: { type: [integer, 'null'] }
              staked: { type: [integer, 'null'] }
              delegated: { type: [integer, 'null'] }
              arnsRecordCount: { type: [integer, 'null'] }
              arioPriceUsd:
                type: [number, 'null']
                description: |
                  USD price of ARIO for this epoch. **Off-chain**, unlike every
                  other field, and independently nullable. Multiply client-side;
                  no USD-denominated field is published, so the seam between
                  on-chain and third-party data stays visible.

                  Value each epoch at ITS OWN price and sum. Converting a
                  cumulative ARIO total at today's price is a different and
                  usually wrong number — ARIO moved -65% across the first 16
                  epochs of this series, which swings the answer by ~16%.
                example: 0.00078441
              arioPriceSource:
                description: >
                  Which kind of price `arioPriceUsd` is, and where it came from.
                  `coingecko:ar-io-network` is a spot reading taken at sample
                  time; `coingecko:ar-io-network:daily-close` is the close of
                  the day before the epoch ended, used for rows recovered by
                  `economics:backfill`. Do not treat the two as interchangeable
                  for intraday work.
                type: [string, 'null']
                example: coingecko:ar-io-network:daily-close
              arioPriceAt:
                type: [integer, 'null']
                description: When the SOURCE observed the price, unix ms — not when we fetched it.

    RewardsDocument:
      type: object
      required: [schemaVersion, generatedAt, epochs, positions]
      properties:
        schemaVersion: { $ref: '#/components/schemas/SchemaVersion' }
        generatedAt: { type: string, format: date-time }
        epochs:
          type: array
          items: { type: integer }
          description: >
            Epochs actually scanned, oldest first. `positions[].rewards` is
            aligned to this index-for-index. An epoch NOT listed was never
            scanned and must not be shown as zero earnings.
        epochEndTimestamps:
          type: array
          items: { type: [integer, 'null'] }
          description: Epoch end times, unix MILLISECONDS, aligned to `epochs`.
        counts:
          type: object
          properties:
            delegate: { type: integer }
            operator: { type: integer }
        totals:
          type: object
          description: >
            Sums in mARIO. `operatorRewards` is 0 until two stake snapshots
            exist, because nothing yet supports a non-zero figure.
          properties:
            delegateRewards: { type: integer }
            operatorRewards: { type: integer }
        positions:
          type: array
          description: Highest total earnings first.
          items:
            type: object
            required: [kind, address, gatewayAddress, rewards, totalRewards, basis]
            properties:
              kind: { type: string, enum: [delegate, operator] }
              address:
                type: string
                description: The wallet holding the position.
              gatewayAddress:
                type: string
                description: The gateway staked on. Equals `address` for an operator.
              rewards:
                type: array
                items: { type: [integer, 'null'] }
                description: >
                  mARIO credited per epoch, aligned to the top-level `epochs`.
                  `null` means scanned and nothing earned.
              totalRewards: { type: integer, description: Sum of non-null entries, mARIO. }
              epochsRewarded: { type: integer }
              currentStake:
                type: [integer, 'null']
                description: >
                  Most recently observed stake, mARIO. Null if the position has
                  never been sampled. Pair with `rewards` to compute yield.
              basis:
                type: string
                enum: [events, inferred]
                description: >
                  `events` is exact, decoded from on-chain reward events.
                  `inferred` is derived from stake movement. Never present them
                  as equivalent.

    NetworkSummary:
      type: object
      required: [schemaVersion, generatedAt, totals]
      description: |
        Daily centralization analysis. `economics` estimates reward
        concentration; it is not a record of payments.
      properties:
        schemaVersion: { $ref: '#/components/schemas/SchemaVersion' }
        generatedAt:
          type: string
          format: date-time
          description: |
            Refreshed DAILY, not every 10 minutes. Staleness here means the
            analysis stopped, not that the network is quiet.
        totals:
          type: object
          properties:
            gatewaysInNetwork: { type: integer, description: Every gateway on chain. }
            gatewaysAnalyzed:
              type: integer
              description: Only those `joined` AND publishing an FQDN — roughly half.
            resolved: { type: integer }
            failedDns: { type: integer }
            clustered: { type: integer, description: Gateways placed in a same-actor cluster. }
            highCentralization:
              type: integer
              description: |
                Collapses to 0 if the run had SKIP_GEO=1 — geography is 25% of
                the score. Cross-check `infrastructure.uniqueAsns` before
                reading a low value as good news.
        clusters:
          type: array
          description: Groups of gateways that look like one actor.
          items:
            type: object
            properties:
              id: { type: string }
              key: { type: string }
              size: { type: integer }
              avgScore: { type: number }
              baseDomain: { type: string }
              pattern: { type: string }
              gateways: { type: array, items: { type: string } }
              wallets: { type: array, items: { type: string } }
              totalRewards: { type: number }
        topSuspicious:
          type: array
          items:
            type: object
            properties:
              fqdn: { type: string }
              score: { type: number }
              reasons: { type: array, items: { type: string } }
        infrastructure:
          type: object
          description: |
            All zeros when the run had SKIP_GEO=1. Treat `uniqueAsns: 0` as a
            degraded run rather than a finding.
          properties:
            totalDatacenterHosted: { type: integer }
            datacenterPercentage: { type: number }
            topProviders: { type: array, items: { type: object, additionalProperties: true } }
            countryDistribution: { type: array, items: { type: object, additionalProperties: true } }
            uniqueIsps: { type: integer }
            uniqueCountries: { type: integer }
            uniqueAsns: { type: integer }
        observers:
          type: object
          description: Rollup of the observer-independence findings for the analysed window.
          properties:
            epochRange: { type: object, additionalProperties: true }
            observerCount: { type: integer }
            findingCount: { type: integer }
            bySeverity: { type: object, additionalProperties: { type: integer } }
            byKind: { type: object, additionalProperties: { type: integer } }
        economics:
          description: |
            Estimated reward concentration for the current epoch. `null` only
            when the epoch has no eligible gateway reward.
          oneOf:
            - $ref: '#/components/schemas/Economics'
            - type: 'null'
        versions:
          nullable: true
          description: Gateway release-version distribution. Null if the run skipped performance probes.

    Economics:
      type: object
      required:
        - rewardPerGateway
        - totalDistributedRewards
        - topCentralizedRewards
        - topCentralizedPercentage
        - rewardsByCluster
      description: |
        Estimated reward concentration across same-actor clusters.

        **This is an estimate, not a payment record.** Every figure derives from
        the epoch's `totalEligibleGatewayReward` multiplied by gateway counts —
        it answers "what does this cluster stand to earn if every member is
        paid the per-gateway reward", not "what was actually distributed".
        Nothing here is reconciled against on-chain transfers.

        All ARIO amounts are in **mARIO** (6 decimals), as on chain. Divide by
        1e6 at the display boundary.
      properties:
        rewardPerGateway:
          type: integer
          description: |
            The epoch's `totalEligibleGatewayReward`, in mARIO — what a single
            eligible gateway stands to earn. Every other figure is derived from
            this.
          example: 108898765275
        totalDistributedRewards:
          type: integer
          description: |
            `rewardPerGateway` × the number of analysed gateways, in mARIO.
            Named "distributed" for historical reasons — it is the estimated
            pool, not a settled total.
          example: 34412009827900
        topCentralizedRewards:
          type: integer
          description: Sum of `rewardsByCluster[].clusterRewards`, in mARIO.
          example: 26353501200000
        topCentralizedPercentage:
          type: number
          format: double
          description: |
            `topCentralizedRewards` as a percentage of
            `totalDistributedRewards` — the headline concentration figure: how
            much of the reward pool flows to gateways that cluster together as
            one apparent actor.
          example: 76.58
        rewardsByCluster:
          type: array
          description: |
            Per-cluster breakdown, sorted by `clusterRewards` descending, with
            zero-reward clusters omitted. Join `clusterId` against
            `NetworkSummary.clusters[].id` for the member gateways and wallets.
          items:
            type: object
            required: [clusterId, clusterRewards, gatewayCount, percentageOfTotal]
            properties:
              clusterId:
                type: string
                description: Matches `NetworkSummary.clusters[].id`.
                example: domain-3
              clusterRewards:
                type: integer
                description: mARIO this cluster stands to earn.
                example: 3266962958250
              gatewayCount:
                type: integer
                example: 30
              percentageOfTotal:
                type: number
                format: double
                example: 9.49

    PortalProgramIds:
      type: object
      required: [core, gar, arns, ant]
      description: |
        The Solana programs the document was derived from.

        Carried on the manifest AND on every document. `network` alone is not
        enough: program ids are per-cluster, the SDK requires explicit
        overrides off mainnet, and a redeploy moves them. A consumer that
        decodes accounts from the wrong program does not get an error, it gets
        plausible nonsense — so compare these against the ids your client is
        configured with and refuse a mismatch.
      properties:
        core: { type: string, description: ario-core program id }
        gar:  { type: string, description: ario-gar program id }
        arns: { type: string, description: ario-arns program id }
        ant:  { type: string, description: ario-ant program id }

    PortalCollection:
      type: object
      required: [schemaVersion, generatedAt, network, programIds, count, items]
      description: |
        Envelope shared by every portal collection. `items` carries the SDK's
        decoded shape verbatim rather than a projection, so a consumer reading
        a field the portal renders cannot find it missing here.
      properties:
        schemaVersion: { $ref: '#/components/schemas/SchemaVersion' }
        generatedAt: { type: string, format: date-time }
        network: { $ref: '#/components/schemas/PortalNetwork' }
        programIds: { $ref: '#/components/schemas/PortalProgramIds' }
        count:
          type: integer
          description: Always `items.length`. Never a separately tracked total.
        items:
          type: array
          items: { type: object, additionalProperties: true }

    PortalSummary:
      type: object
      required: [schemaVersion, generatedAt, network, programIds, counts]
      properties:
        schemaVersion: { $ref: '#/components/schemas/SchemaVersion' }
        generatedAt: { type: string, format: date-time }
        network: { $ref: '#/components/schemas/PortalNetwork' }
        programIds: { $ref: '#/components/schemas/PortalProgramIds' }
        counts:
          type: object
          required: [gateways, vaults, balances, delegates, arnsRecords]
          properties:
            gateways: { type: integer }
            vaults: { type: integer }
            balances: { type: integer }
            delegates: { type: integer }
            arnsRecords:
              type: integer
              description: Count only; the records themselves are not published.
        tokenSupply:
          type: object
          additionalProperties: true
          description: Total, circulating and locked supply, in mARIO.
        demandFactor:
          type: [number, 'null']
          description: Null when that read failed; its absence degrades rather than fails a cycle.
        gatewayRegistrySettings:
          type: object
          additionalProperties: true

    Error:
      type: object
      required: [error, path]
      properties:
        error: { type: string, examples: ['not_found'] }
        path: { type: string }

    Severity:
      type: string
      enum: [info, low, medium, high]

    DocumentRef:
      type: object
      required: [path, sha256, bytes, generatedAt]
      properties:
        path: { type: string }
        sha256:
          type: string
          description: Of the document body; lets a consumer skip a re-parse.
        bytes: { type: integer }
        generatedAt: { type: string, format: date-time }

    IndexDocument:
      type: object
      required: [schemaVersion, generatedAt, documents]
      properties:
        schemaVersion: { $ref: '#/components/schemas/SchemaVersion' }
        generatedAt: { type: string, format: date-time }
        documents:
          type: object
          description: Every published document, keyed by kind.
          properties:
            observers: { $ref: '#/components/schemas/DocumentRef' }
            findings: { $ref: '#/components/schemas/DocumentRef' }
            epochs:
              type: array
              items: { $ref: '#/components/schemas/DocumentRef' }
        freshness:
          type: object
          description: Age of the capture and analysis cadences at generation time.
        archive:
          type: object
          description: Dated snapshots of earlier generations, when retained.

    SchemaVersion:
      type: string
      description: |
        Contract version of the document. Additive changes keep the version;
        a breaking change increments the major and is served at a new path.
      examples: ['1.0.0']

    FindingsWindow:
      type: object
      required: [epochs, from, truncated, olderFindingsAt]
      description: |
        Declares that the feed is a window rather than the whole history, so a
        consumer can never mistake one for the other.
      properties:
        epochs:
          type: integer
          description: Epochs retained. `0` means unwindowed.
        from:
          type: [integer, 'null']
          description: Oldest epoch present.
        truncated:
          type: boolean
          description: True when findings were dropped from this document.
        olderFindingsAt:
          type: string
          description: Where dropped findings remain addressable.
          examples: ['epochs/<epochIndex>.json']

    PairwiseEntry:
      type: object
      description: |
        One pair from the similarity matrix. `a` and `b` are **indices into the
        finding's `observers` array**, not addresses.
      required: [a, b, similarity, hammingBits]
      properties:
        a: { type: integer, minimum: 0 }
        b: { type: integer, minimum: 0 }
        similarity:
          type: number
          description: 1.0 is byte-identical over the meaningful bytes.
        hammingBits: { type: integer }
        hammingBytes: { type: integer }

    Finding:
      type: object
      required: [id, kind, observers, severity, confidence, detectedAt, summary]
      properties:
        id: { type: string }
        kind:
          type: string
          description: Detector that produced it.
          examples: ['shared_report_tx', 'near_identical_results']
        epochIndex:
          type: [integer, 'null']
          description: Null for cross-epoch findings, which describe the window itself.
        observers:
          type: array
          description: Every observer in the finding. Pair indices resolve against this.
          items: { type: string }
        observerCount: { type: integer }
        severity: { $ref: '#/components/schemas/Severity' }
        confidence:
          type: number
          description: Capped at 0.5 while the similarity threshold is uncalibrated.
        detectedAt: { type: string, format: date-time }
        summary:
          type: string
          description: One sentence stating what the data shows, not what it means.
        detail:
          type: object
          description: |
            Detector-specific evidence. For similarity kinds this includes
            `pairsTotal`, `pairsTruncated` and a truncated `pairs` array.
          properties:
            pairsTotal:
              type: integer
              description: Pairs in the full matrix.
            pairsTruncated:
              type: integer
              description: Pairs omitted from `pairs`.
            pairs:
              type: array
              description: The 20 most-similar pairs. **Not the complete set.**
              items: { $ref: '#/components/schemas/PairwiseEntry' }
            minSimilarity: { type: number }
            maxSimilarity: { type: number }
            allBlobsDistinct:
              type: boolean
              description: |
                True when no two blobs were byte-identical — the case an
                equality check would miss entirely.

    FindingsDocument:
      type: object
      required: [schemaVersion, generatedAt, calibrated, window, counts, findings]
      properties:
        schemaVersion: { $ref: '#/components/schemas/SchemaVersion' }
        generatedAt: { type: string, format: date-time }
        detectorVersion: { type: integer }
        calibrated:
          type: boolean
          description: |
            **Check this first.** While false, `thresholdSimilarity` is a
            placeholder and similarity findings over-sweep; severity is capped
            at `medium` and confidence at 0.5.
        calibrationId: { type: [integer, 'null'] }
        thresholdSimilarity: { type: number }
        epochRange:
          type: [object, 'null']
          properties:
            from: { type: integer }
            to: { type: integer }
            count: { type: integer }
        window: { $ref: '#/components/schemas/FindingsWindow' }
        counts:
          type: object
          properties:
            total: { type: integer }
            bySeverity:
              type: object
              additionalProperties: { type: integer }
            byKind:
              type: object
              additionalProperties: { type: integer }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }

    ObserverRollup:
      type: object
      required: [observer, epochsObserved]
      properties:
        observer: { type: string, description: Base58 Solana address. }
        fqdn:
          type: [string, 'null']
          description: Gateway hostname from the registry, when known.
        epochsObserved: { type: integer }
        firstEpochIndex: { type: integer }
        lastEpochIndex: { type: integer }
        distinctReportTxIds: { type: integer }
        sharedReportEpochs:
          type: integer
          description: Epochs where this observer cited a report another also cited.
        findingCount: { type: integer }
        maxSeverity: { $ref: '#/components/schemas/Severity' }
        kinds:
          type: array
          items: { type: string }

    ObserversDocument:
      type: object
      required: [schemaVersion, generatedAt, observers]
      properties:
        schemaVersion: { $ref: '#/components/schemas/SchemaVersion' }
        generatedAt: { type: string, format: date-time }
        epochRange:
          type: [object, 'null']
          properties:
            from: { type: integer }
            to: { type: integer }
            count: { type: integer }
        observerCount: { type: integer }
        observers:
          type: array
          items: { $ref: '#/components/schemas/ObserverRollup' }
        epochs:
          type: array
          items: { type: integer }

    Observation:
      type: object
      required: [observer, reportTxId, gatewayCount, submittedAt]
      properties:
        observer: { type: string }
        reportTxId:
          type: string
          description: |
            Arweave transaction holding the full report. **Not unique** — several
            observers can cite the same one, which is itself a signal.
        gatewayCount: { type: integer }
        submittedAt:
          type: integer
          description: Unix seconds, from chain.

    EpochDocument:
      type: object
      required: [schemaVersion, generatedAt, epochIndex, observationCount, observations]
      properties:
        schemaVersion: { $ref: '#/components/schemas/SchemaVersion' }
        generatedAt: { type: string, format: date-time }
        epochIndex: { type: integer }
        observationCount: { type: integer }
        distinctReportTxIds:
          type: integer
          description: Fewer than `observationCount` means reports were shared.
        registryCaptured:
          type: boolean
          description: |
            Whether the gateway registry slot order was captured for this epoch.
            Without it the results bitmap cannot later be mapped to gateways.
        registryApproximate: { type: boolean }
        registryDigest: { type: [string, 'null'] }
        firstSubmittedAtUnix: { type: [integer, 'null'] }
        lastSubmittedAtUnix: { type: [integer, 'null'] }
        observations:
          type: array
          items: { $ref: '#/components/schemas/Observation' }
        findings:
          type: array
          description: All findings for this epoch, including any aged out of the feed.
          items: { $ref: '#/components/schemas/Finding' }

    Health:
      type: object
      required: [status, capture]
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          description: Aggregate. A 200 response does not imply `ok`.
        published: { type: boolean }
        capture:
          type: object
          properties:
            status: { type: string, enum: [ok, anomaly, error] }
            lastRunAt: { type: string, format: date-time }
            ageSeconds: { type: integer }
            stale:
              type: boolean
              description: Alert on this — a stalled capture loses epochs permanently.
            accountCount:
              type: integer
              description: |
                Accounts seen last cycle. Alert on `0`: it means the
                discriminator stopped matching, which otherwise looks like a
                quiet network.
            consecutiveFailures: { type: integer }
        analysis:
          type: object
          properties:
            status: { type: string }
            lastRunAt: { type: string, format: date-time }
