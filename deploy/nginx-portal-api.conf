# nginx for the portal snapshot API.
#
# The documents are static files that a publisher rewrites every ten minutes,
# so nginx serves them straight off disk and never proxies to Node for them.
# That matters: the Node server reads each file synchronously per request,
# which is fine at moderate load but puts disk I/O on the event loop. nginx
# with sendfile and gzip_static answers the same request without either.
#
# Node is still the source of /healthz, which reads live state.
#
# Topology: Hetzner load balancer -> nginx -> disk.
# TLS terminates at the load balancer, so this listens on plain HTTP and trusts
# the forwarded scheme. Do NOT expose this port publicly.

# The load balancer is the only client, so take the real client IP from it
# rather than logging the balancer's address for every request. Replace with
# the balancer's actual subnet — a wildcard here would let any client spoof
# its address by setting the header itself.
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# One shared zone for both instances. 30r/s per address is far above what a
# browser does (a handful of requests per page load, then 304s) and far below
# what a scraper does.
limit_req_zone $binary_remote_addr zone=portal_api:10m rate=30r/s;

# /healthz is the ONLY path that reaches Node — everything under /api/v1/ is
# served off disk and never touches a process. It was also the only location
# without a limit, which is exactly backwards: the cheapest request to send was
# the most expensive one to serve. 120 concurrent /healthz requests took a
# 2-core box from idle to load 5.2.
#
# 5r/s is far above any real monitor (the box's own timer polls every 5 min,
# external checks every 30-60s) and far below what a loop generates.
limit_req_zone $binary_remote_addr zone=portal_health:1m rate=5r/s;

# limit_req shapes arrival rate but does nothing about a client that opens
# hundreds of slow connections and holds them; each costs a worker slot and,
# for /healthz, an upstream socket.
limit_conn_zone $binary_remote_addr zone=portal_conn:1m;

map $http_accept_encoding $portal_gzip_ok {
    default        0;
    "~*gzip"       1;
}

server {
    listen 80;
    server_name network.services.ar.io;

    # Published by ario-portal-publish@prod.service
    root /var/lib/ario-portal-api/prod/public;

    access_log /var/log/nginx/portal-api-prod.access.log;
    error_log  /var/log/nginx/portal-api-prod.error.log;

    # The publisher writes <doc>.json.gz next to every <doc>.json, so nginx can
    # serve the precompressed bytes without compressing per request.
    gzip_static on;
    # Do not compress on the fly as well: the files are already gzipped at
    # publish time and everything else here is tiny.
    gzip off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Only GET and HEAD exist. Rejecting the rest at the edge keeps write
    # methods from ever reaching a process.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # ---- static documents: served from disk, never proxied ----
    location /api/v1/ {
        limit_req zone=portal_api burst=60 nodelay;

        # Browsers on other origins are the consumer.
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header X-Content-Type-Options       "nosniff" always;
        add_header Referrer-Policy              "no-referrer" always;
        add_header Vary                         "Accept-Encoding" always;

        # The API serves its own contract at /api/v1/openapi.yaml; without a
        # yaml type it falls through to default_type and downloads instead.
        types { application/json json; application/yaml yaml; }
        default_type application/json;

        # The manifest is the polling target and must go stale before the
        # documents it describes, or a client can hold a manifest that
        # disagrees with what it fetches.
        # `add_header` does NOT inherit into a nested location — declaring any
        # header here drops every header set by the parent. So the full set is
        # repeated, not just the one that differs (Cache-Control). Dropping
        # Access-Control-Allow-Methods and Referrer-Policy here is exactly the
        # bug this comment exists to prevent: the manifest is the document
        # every consumer polls, so it is the worst one to serve differently.
        location = /api/v1/portal/index.json {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header X-Content-Type-Options       "nosniff" always;
            add_header Referrer-Policy              "no-referrer" always;
            add_header Vary                         "Accept-Encoding" always;
            # The manifest is the polling target and must go stale before the
            # documents it describes.
            add_header Cache-Control "public, max-age=30" always;
            try_files $uri =404;
        }

        add_header Cache-Control "public, max-age=60" always;

        # =404 rather than a directory listing or an index fallback: an
        # unpublished document must not resolve to something else.
        try_files $uri =404;
    }

    # ---- health: live state, so it comes from the process ----
    location = /healthz {
        # See conf.d/portal-api-zone.conf: this is the only location that
        # reaches a process, so it is the one that most needs a ceiling.
        limit_req zone=portal_health burst=10 nodelay;
        limit_conn portal_conn 20;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Health must not be cached anywhere.
        add_header Cache-Control "no-store" always;

        # A health check should fail fast rather than pile up connections.
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }

    location / {
        return 404;
    }
}

# ---- testnet: same box, same config, different root and port ----
server {
    listen 80;
    server_name network.services.ar-io.dev;

    root /var/lib/ario-portal-api/testnet/public;

    access_log /var/log/nginx/portal-api-testnet.access.log;
    error_log  /var/log/nginx/portal-api-testnet.error.log;

    gzip_static on;
    gzip off;
    sendfile on;
    tcp_nopush on;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location /api/v1/ {
        limit_req zone=portal_api burst=60 nodelay;

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header X-Content-Type-Options       "nosniff" always;
        add_header Referrer-Policy              "no-referrer" always;
        add_header Vary                         "Accept-Encoding" always;

        # The API serves its own contract at /api/v1/openapi.yaml; without a
        # yaml type it falls through to default_type and downloads instead.
        types { application/json json; application/yaml yaml; }
        default_type application/json;

        # `add_header` does NOT inherit into a nested location — declaring any
        # header here drops every header set by the parent. So the full set is
        # repeated, not just the one that differs (Cache-Control). Dropping
        # Access-Control-Allow-Methods and Referrer-Policy here is exactly the
        # bug this comment exists to prevent: the manifest is the document
        # every consumer polls, so it is the worst one to serve differently.
        location = /api/v1/portal/index.json {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header X-Content-Type-Options       "nosniff" always;
            add_header Referrer-Policy              "no-referrer" always;
            add_header Vary                         "Accept-Encoding" always;
            # The manifest is the polling target and must go stale before the
            # documents it describes.
            add_header Cache-Control "public, max-age=30" always;
            try_files $uri =404;
        }

        add_header Cache-Control "public, max-age=60" always;
        try_files $uri =404;
    }

    location = /healthz {
        # See conf.d/portal-api-zone.conf: this is the only location that
        # reaches a process, so it is the one that most needs a ceiling.
        limit_req zone=portal_health burst=10 nodelay;
        limit_conn portal_conn 20;

        # The testnet instance serves on a different port so the two never
        # share a process or a public directory.
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Cache-Control "no-store" always;
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }

    location / {
        return 404;
    }
}
